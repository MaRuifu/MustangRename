[package]
name = "mustang-rename"
version = "0.1.0"
description = "MustangRename - 批量重命名工具"
authors = ["马瑞富 <email@maruifu.cn>"]
homepage = "https://maruifu.com"
edition = "2021"

[lib]
name = "mustang_rename_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
strip = true
lto = true
